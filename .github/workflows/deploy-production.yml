name: Deploy Supabase Production

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable release tag from main, for example v0.1.0"
        required: true
        type: string
      confirm_production:
        description: "I confirm that QA passed and the production rollout is approved"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release candidate
    if: inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag reachable from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be a version tag such as v0.1.0."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
          if [[ "$(git cat-file -t "$RELEASE_REF")" != "tag" ]]; then
            echo "$RELEASE_REF must be an annotated tag."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_REF^{commit}" origin/main; then
            echo "$RELEASE_REF is not reachable from origin/main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: tools/db-validation/package-lock.json
          package-manager-cache: true

      - name: Install locked validator dependencies
        run: npm ci --prefix tools/db-validation

      - name: Replay migrations and run integration tests
        run: node tools/db-validation/validate.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
          cache: true

      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/functions -type f -name '*.ts' -print -quit 2>/dev/null | grep -q .; then
            find supabase/functions -type f -name '*.ts' -print0 | xargs -0 deno check --no-lock
          fi

  deploy:
    name: Deploy migrations and Edge Functions
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out approved release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Environment configuration: $name"
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.101.0

      - name: Link Supabase Production
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply approved database migrations
        run: supabase db push --linked --yes

      - name: Deploy approved Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Show migration state
        run: supabase migration list --linked

      - name: Write deployment summary
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          deployed_sha="$(git rev-parse HEAD)"
          {
            echo "## Supabase Production deployed"
            echo ""
            echo "- Release: \`$RELEASE_REF\`"
            echo "- Commit: \`$deployed_sha\`"
            echo "- Migrations: applied"
            echo "- Edge Functions: deployed"
          } >> "$GITHUB_STEP_SUMMARY"
