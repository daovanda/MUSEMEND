name: Deploy Supabase Development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migrations and Edge Functions
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out the CI-verified revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Environment configuration: $name"
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.101.0

      - name: Link Supabase Development
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        run: supabase db push --linked --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Show migration state
        run: supabase migration list --linked

      - name: Write deployment summary
        shell: bash
        run: |
          deployed_sha="$(git rev-parse HEAD)"
          {
            echo "## Supabase Development deployed"
            echo ""
            echo "- Commit: \`$deployed_sha\`"
            echo "- Migrations: applied"
            echo "- Edge Functions: deployed"
          } >> "$GITHUB_STEP_SUMMARY"
