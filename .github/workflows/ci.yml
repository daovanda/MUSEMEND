name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-docs:
    name: Policy and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            AGENTS.md
            docs/README.md
            docs/fe/README.md
            docs/be/README.md
            docs/db/README.md
            docs/other/README.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required documentation is missing or empty: $file"
              exit 1
            fi
          done

      - name: Require domain documentation in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          require_domain_docs() {
            local implementation_pattern="$1"
            local documentation_pattern="$2"
            local domain="$3"

            if grep -Eq "$implementation_pattern" <<<"$changed_files" && \
               ! grep -Eq "$documentation_pattern" <<<"$changed_files"; then
              echo "$domain changed without an accompanying Markdown update."
              exit 1
            fi
          }

          require_domain_docs \
            '^app/' \
            '^docs/fe/.*\.md$' \
            'Frontend'
          require_domain_docs \
            '^supabase/functions/|^supabase/config\.toml$' \
            '^docs/be/.*\.md$' \
            'Backend'
          require_domain_docs \
            '^supabase/(migrations|tests|baseline)/' \
            '^docs/db/.*\.md$' \
            'Database'
          require_domain_docs \
            '^\.github/workflows/' \
            '^docs/other/.*\.md$' \
            'CI/CD'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  database:
    name: Database migrations and RLS/RPC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: tools/db-validation/package-lock.json
          package-manager-cache: true

      - name: Install locked database validator dependencies
        run: npm ci --prefix tools/db-validation

      - name: Audit validator dependencies
        run: npm audit --prefix tools/db-validation --audit-level=high

      - name: Replay migrations and run integration tests
        run: node tools/db-validation/validate.mjs

  edge-functions:
    name: Edge Function static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Detect Edge Functions
        id: functions
        shell: bash
        run: |
          if find supabase/functions -type f -name '*.ts' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Edge Function TypeScript files yet; checks are skipped."
          fi

      - name: Set up Deno
        if: steps.functions.outputs.present == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
          cache: true

      - name: Lint Edge Functions
        if: steps.functions.outputs.present == 'true'
        run: deno lint supabase/functions

      - name: Type-check Edge Functions
        if: steps.functions.outputs.present == 'true'
        shell: bash
        run: find supabase/functions -type f -name '*.ts' -print0 | xargs -0 deno check --no-lock

  flutter:
    name: Flutter analyze, test, and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Detect Flutter module and pinned SDK
        id: flutter-project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f app/pubspec.yaml ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Flutter module app/ has not been created; Flutter checks are skipped."
            exit 0
          fi
          if [[ ! -s app/.fvmrc ]]; then
            echo "app/.fvmrc must pin an exact Flutter SDK version."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.flutter-project.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/.fvmrc
          cache: true

      - name: Install locked Flutter dependencies
        if: steps.flutter-project.outputs.present == 'true'
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        if: steps.flutter-project.outputs.present == 'true'
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        if: steps.flutter-project.outputs.present == 'true'
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        if: steps.flutter-project.outputs.present == 'true'
        working-directory: app
        run: flutter test --coverage

      - name: Build tester APK
        if: steps.flutter-project.outputs.present == 'true'
        working-directory: app
        run: flutter build apk --debug

      - name: Upload tester APK
        if: steps.flutter-project.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: musemend-debug-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
